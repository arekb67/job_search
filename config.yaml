# =============================================================================
# PREFERRED LOCATIONS
# =============================================================================
# Jobs matching these location keywords pass the initial location filter.
# Used when scanning career pages for relevant postings.

preferred_locations:
  - "london"
  - "uk"
  - "united kingdom"
  - "remote"
  - "hybrid"
  - "europe"


# =============================================================================
# LOCATION VERIFICATION
# =============================================================================
# Stage 2 fetches full job descriptions and checks they are genuinely for
# London or remote positions. This catches jobs listed as "London" on the
# careers page but actually based in another city.

location_verification:
  # Keywords that confirm a job is based in London
  london_keywords:
    - "london"
    - "london, uk"
    - "london, united kingdom"
    - "uk - london"
    - "london office"

  # Keywords that confirm a job allows remote or hybrid working
  remote_keywords:
    - "remote"
    - "remote working"
    - "work from home"
    - "wfh"
    - "remote-first"
    - "fully remote"
    - "hybrid"
    - "hybrid working"
    - "flexible location"
    - "location flexible"

  # Non-London cities and their common name variations.
  # If a job description mentions one of these cities prominently,
  # the job is rejected as being based outside London.
  non_london_cities:
    austin:
      - "austin"
      - "austin, texas"
      - "austin, tx"
    new york:
      - "new york"
      - "nyc"
      - "new york city"
      - "new york, ny"
    chicago:
      - "chicago"
      - "chicago, il"
      - "chicago, illinois"
    san francisco:
      - "san francisco"
      - "sf"
      - "bay area"
      - "san francisco, ca"
    singapore:
      - "singapore"
    hong kong:
      - "hong kong"
    sydney:
      - "sydney"
    tokyo:
      - "tokyo"
    amsterdam:
      - "amsterdam"
    paris:
      - "paris"
    frankfurt:
      - "frankfurt"
    zurich:
      - "zurich"
    mumbai:
      - "mumbai"
    shanghai:
      - "shanghai"
    dallas:
      - "dallas"
      - "dallas, tx"
    houston:
      - "houston"
      - "houston, tx"
    jersey city:
      - "jersey city"
      - "jersey city, nj"
    tulsa:
      - "tulsa"
    gurugram:
      - "gurugram"
      - "gurgaon"
    noida:
      - "noida"
    taipei:
      - "taipei"


# =============================================================================
# DOMAIN VERIFICATION
# =============================================================================
# Stage 2 checks that job descriptions mention trading/infrastructure topics.
# This prevents picking up unrelated roles (e.g. HR, marketing) that happen
# to be at trading firms.

domain_verification:
  # At least ONE of these keywords must appear in the job description.
  # Grouped by category for readability.
  required_keywords:
    # Trading platform keywords
    - "trading platform"
    - "trading infrastructure"
    - "trading system"
    - "trading technology"
    - "execution platform"
    - "order management"
    - "oms"
    - "execution management"
    - "ems"
    - "market data"
    - "market connectivity"
    - "exchange connectivity"
    - "fix protocol"
    - "algorithmic trading"
    - "algo trading"
    - "electronic trading"
    - "equities trading"
    - "derivatives trading"
    - "forex trading"
    - "crypto trading"
    # Infrastructure keywords
    - "platform infrastructure"
    - "market infrastructure"
    - "low latency"
    - "high frequency"
    - "hft"
    - "ultra-low latency"
    - "colocation"
    - "co-location"
    - "proximity hosting"
    - "exchange hosting"
    - "connectivity infrastructure"
    - "network infrastructure"
    - "market access"
    # Platform product keywords
    - "platform product"
    - "infrastructure product"
    - "trading product"
    - "platform owner"
    - "platform management"
    - "platform engineering"
    - "quant platform"
    - "research platform"
    - "quantitative infrastructure"
    # Core trading tech
    - "risk management system"
    - "pricing engine"
    - "trade lifecycle"
    - "post-trade"
    - "settlement system"
    - "clearing"
    - "portfolio management"
    - "pms"
    - "investment management system"

  # Jobs containing these keywords are rejected (wrong domain entirely).
  excluded_keywords:
    - "customer support"
    - "customer service"
    - "client service"
    - "marketing"
    - "human resources"
    - "hr technology"
    - "talent acquisition"
    - "recruitment"
    - "finance system"
    - "accounting software"
    - "erp"
    - "crm"
    - "mobile app"
    - "mobile application"
    - "consumer app"
    - "retail banking"
    - "insurance tech"
    - "insurtech"
    - "wealth management app"
    - "legal tech"
    - "compliance software"


# =============================================================================
# SALARY DETECTION PATTERNS
# =============================================================================
# Used to detect whether a job shows USD salaries without GBP equivalents,
# which often indicates a US-based role listed on a global careers page.
# These are regular expression patterns — edit with care.

salary_detection:
  usd_pattern: '\$\d{2,3},\d{3}'
  gbp_pattern: '\xa3\d{2,3},\d{3}'


