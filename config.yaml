# =============================================================================
# SCORER SETTINGS (used by phase2_scorer.py)
# =============================================================================
# These control how the Claude AI scores jobs against your CV.

scorer_settings:
  # Filename pattern for your CV. The script finds the most recent file
  # matching this pattern by looking for a YYYYMMDD date in the filename.
  # Example: "CV - Arek Baranowski 20260303.docx" matches this pattern.
  cv_filename_pattern: "CV - Arek Baranowski*.docx"

  # Your years of professional experience (used in the scoring prompt)
  years_of_experience: 20

  # Which Claude model to use for scoring.
  # "claude-sonnet-4-20250514" is recommended (good balance of speed and quality).
  claude_model: "claude-sonnet-4-20250514"

  # Maximum tokens (words) Claude can use in its scoring response.
  max_tokens: 2000

  # How many times to retry if a Claude API call fails.
  api_retry_attempts: 3

  # Pause (seconds) between retries after an API error.
  api_retry_delay: 5

  # Pause (seconds) between each job scoring call.
  # Prevents hitting API rate limits.
  api_rate_limit_pause: 1

  # Maximum characters of job description sent to Claude for scoring.
  # Longer descriptions are truncated to save API costs.
  job_description_max_chars: 4000


# =============================================================================
# CANDIDATE PROFILE
# =============================================================================
# Your target roles and technical skills. These are included in the prompt
# sent to Claude so it knows what kind of roles you're looking for and
# what skills to match against.

candidate_profile:
  # Job titles you're targeting (Claude uses these to assess role fit)
  target_roles:
    - "Product Manager"
    - "Platform Owner"
    - "Technical Program Manager"
    - "Head of Infrastructure"
    - "Head of Platform"
    - "Director of Product"
    - "Solutions Architect"

  # Your core technical skills (Claude checks job requirements against these)
  technical_skills:
    - "trading infrastructure"
    - "low-latency"
    - "colocation"
    - "exchange connectivity"
    - "market data"
    - "FIX protocol"
    - "platform ownership"
    - "architecture"
    - "multi-asset electronic execution"
    - "messaging infrastructure"


# =============================================================================
# INDUSTRY CLASSIFICATION
# =============================================================================
# How Claude scores companies based on their industry. Tier 1 companies
# (hedge funds, prop trading) score highest.

industry_tiers:
  tier1:
    description: "hedge funds, prop trading, market makers"
    score_range: "90-100"
  tier2:
    description: "FinTech, trading technology, capital markets"
    score_range: "75-89"
  tier3:
    description: "broader financial services"
    score_range: "50-74"


# =============================================================================
# LOCATION SCORING PREFERENCES (for Claude AI scorer)
# =============================================================================
# How Claude scores jobs based on their location.
# Edit the score ranges if your location preferences change.

location_scores:
  "London UK office": "95-100"
  "London + hybrid/remote": "100"
  "Fully remote": "85-90"
  "Other UK": "60-70"
  "Europe": "40-50"
  "US or other": "10-20"


# =============================================================================
# RECOMMENDATION THRESHOLDS & COLOURS
# =============================================================================
# How the overall score (average of 5 dimensions) maps to a recommendation.
# Adjust these numbers to be more or less selective.

recommendations:
  thresholds:
    apply_immediately: 80    # Score 80+ = Apply Immediately
    strong_consider: 65      # Score 65-79 = Strong Consider
    consider: 50             # Score 50-64 = Consider
    # Below 50 = Skip

  # Colours for each recommendation level in the Excel output (hex RGB codes)
  colours:
    "Apply Immediately": "C6EFCE"    # Green
    "Strong Consider": "DDEBF7"      # Light blue
    "Consider": "FFF2CC"             # Yellow
    "Skip": "F2DCDB"                 # Light red
