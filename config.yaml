# =============================================================================
# Job Search Pipeline — Configuration File
# =============================================================================
# This file contains ALL user-configurable settings for both scripts:
#   - job_scraper_2stage.py  (the web scraper)
#   - phase2_scorer.py       (the Claude AI scorer)
#
# HOW TO EDIT:
#   - Open this file in any text editor
#   - Change values after the colon (:) on each line
#   - Keep the indentation (spaces) exactly as shown
#   - Lines starting with # are comments and are ignored
#   - Save the file and re-run the scripts
#
# IMPORTANT:
#   - Do NOT use tabs — only spaces for indentation
#   - Strings with special characters should be in quotes
#   - Lists use a dash (-) before each item
# =============================================================================


# =============================================================================
# SCRAPER SETTINGS
# =============================================================================
# These control how the web scraper behaves when visiting company career pages.

scraper_settings:
  # Minimum score (0-100) for a job title to pass the Stage 1 quick scan.
  # Lower = more results but less relevant. Higher = fewer but better matches.
  min_score_threshold: 65

  # Maximum characters of job description to store in output files.
  description_max_chars: 3000

  # How long to wait (seconds) for a web page to respond before giving up.
  request_timeout: 15

  # Pause (seconds) between visiting different company websites.
  # This is polite crawling — don't set too low or sites may block you.
  polite_delay: 2

  # How many times to retry a failed web request before giving up.
  max_retries: 2

  # Pause (seconds) between retries.
  retry_backoff: 3

  # How many of the top-scoring jobs to fetch full descriptions for in Stage 2.
  stage2_target_valid: 20

  # How many candidate jobs to attempt in Stage 2 (some will fail to load).
  # Set higher than stage2_target_valid to allow for failures.
  stage2_candidate_pool: 50

  # Browser identity string sent with web requests.
  # Changing this is rarely needed — some sites block non-browser requests.
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  # Use headless Chromium (via Playwright) as a fallback when standard HTTP
  # requests fail or return empty/JS-rendered pages. Requires: pip install
  # playwright && playwright install chromium
  playwright_fallback: true


# =============================================================================
# TARGET JOB TITLES & SCORING
# =============================================================================
# These are the job titles the scraper looks for on company career pages.
# Each title has a score and a category.
#
# Score (0-100):
#   100 = perfect match (e.g. your exact target role)
#    85 = strong match (close to what you want)
#    70 = acceptable (worth reviewing but not ideal)
#
# Category:
#   "infrastructure" = product, platform, and infrastructure roles
#   "sales"          = sales, business development, and account roles
#
# The category controls which company types search for this title.
# See "company_type_categories" below for the mapping.
#
# To add a new title: copy an existing line and change the values.
# To remove a title: delete the line or comment it out with #.
# All titles are matched case-insensitively (lowercase is fine).

target_job_titles:
  # --- Perfect matches (score 100) ---
  "platform owner":                {score: 100, category: "infrastructure"}
  "platform product manager":      {score: 100, category: "infrastructure"}
  "head of trading infrastructure": {score: 100, category: "infrastructure"}
  "infrastructure director":       {score: 100, category: "infrastructure"}
  "head of electronic trading":    {score: 100, category: "infrastructure"}
  "director of global connectivity": {score: 100, category: "infrastructure"}
  "head of market data":           {score: 100, category: "infrastructure"}

  # --- Strong matches (score 95) ---
  "head of product":               {score: 95, category: "infrastructure"}
  "head of platform":              {score: 95, category: "infrastructure"}
  "director of product":           {score: 95, category: "infrastructure"}
  "director of platform":          {score: 95, category: "infrastructure"}
  "head of infrastructure":        {score: 95, category: "infrastructure"}
  "head of colocation":            {score: 95, category: "infrastructure"}

  # --- Good matches (score 85) ---
  "technical program manager":     {score: 85, category: "infrastructure"}
  "technical programme manager":   {score: 85, category: "infrastructure"}
  "tpm":                           {score: 85, category: "infrastructure"}
  "senior product manager":        {score: 85, category: "infrastructure"}
  "principal product manager":     {score: 85, category: "infrastructure"}
  "technology product manager":    {score: 85, category: "infrastructure"}
  "technical product manager":     {score: 85, category: "infrastructure"}

  # --- Acceptable matches (score 80) ---
  "solutions architect":           {score: 80, category: "infrastructure"}
  "infrastructure product manager": {score: 80, category: "infrastructure"}
  "colocation manager":            {score: 80, category: "infrastructure"}

  # --- Worth reviewing (score 75) ---
  "product manager":               {score: 75, category: "infrastructure"}
  "platform manager":              {score: 75, category: "infrastructure"}
  "delivery manager":              {score: 75, category: "infrastructure"}
  "program manager":               {score: 75, category: "infrastructure"}
  "programme manager":             {score: 75, category: "infrastructure"}
  "engineering director":          {score: 75, category: "infrastructure"}

  # --- Lower priority (score 70) ---
  "engineering manager":           {score: 70, category: "infrastructure"}
  "delivery lead":                 {score: 70, category: "infrastructure"}
  "platform lead":                 {score: 70, category: "infrastructure"}

  # --- Capital markets sales roles (score 80) ---
  # These are only searched at FinTech and recruitment agency websites,
  # NOT at hedge fund career pages (see company_type_categories below).
  "product sales specialist":      {score: 80, category: "sales"}
  "head of sales":                 {score: 80, category: "sales"}
  "vp sales":                      {score: 80, category: "sales"}
  "sales director":                {score: 80, category: "sales"}
  "solutions consultant":          {score: 80, category: "sales"}
  "pre-sales engineer":            {score: 80, category: "sales"}
  "sales engineer":                {score: 80, category: "sales"}
  "business development director": {score: 80, category: "sales"}
  "business development manager":  {score: 80, category: "sales"}
  "account executive":             {score: 80, category: "sales"}
  "strategic account manager":     {score: 80, category: "sales"}
  "client solutions manager":      {score: 80, category: "sales"}
  "partnership manager":           {score: 80, category: "sales"}
  "technical sales":               {score: 80, category: "sales"}
  "solution sales":                {score: 80, category: "sales"}
  # Broad catch-all terms (only active at FinTech/Recruitment via category filtering)
  "sales":                         {score: 80, category: "sales"}
  "product":                       {score: 80, category: "sales"}


# =============================================================================
# COMPANY TYPE → JOB CATEGORIES
# =============================================================================
# Controls which job title categories are searched at each company type.
# Hedge funds only get infrastructure/product roles.
# FinTech vendors and recruitment agencies get both infrastructure and sales.

company_type_categories:
  "Hedge Fund / Prop Trading":
    - "infrastructure"
  "FinTech":
    - "infrastructure"
    - "sales"
  "Recruitment Agency":
    - "infrastructure"
    - "sales"


# =============================================================================
# EXCLUDED JOB TITLES
# =============================================================================
# Jobs containing ANY of these keywords in the title are automatically skipped.
# These are typically individual contributor (IC) or unrelated roles.

exclude_keywords:
